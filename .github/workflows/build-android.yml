name: Build APK (Android)

on:
  push:
    branches:
      - master
    paths:
      - "src/LicenciamentoSoftware.Maui/**"
      - "src/LicenciamentoSoftware.Client/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build e Assinar APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-maui-android-${{ hashFiles('src/LicenciamentoSoftware.Maui/**/*.csproj', 'src/LicenciamentoSoftware.Client/**/*.csproj') }}
          restore-keys: nuget-maui-android-

      - name: Restore
        run: dotnet restore src/LicenciamentoSoftware.Maui/LicenciamentoSoftware.Maui.csproj /p:TargetFramework=net10.0-android

      - name: Obter versão do app
        id: version
        run: |
          DISPLAY_VERSION=$(grep -oPm1 "(?<=<ApplicationDisplayVersion>)[^<]+" src/LicenciamentoSoftware.Maui/LicenciamentoSoftware.Maui.csproj || echo "1.0")
          BUILD_VERSION=$(grep -oPm1 "(?<=<ApplicationVersion>)[^<]+" src/LicenciamentoSoftware.Maui/LicenciamentoSoftware.Maui.csproj || echo "1")
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$BUILD_VERSION"     >> $GITHUB_OUTPUT
          echo "Version: $DISPLAY_VERSION.$BUILD_VERSION"

      - name: Preparar keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            # Secret configurado — usar keystore do repositório
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/licensemanager.keystore
            echo "KEYSTORE_PATH=/tmp/licensemanager.keystore"   >> $GITHUB_OUTPUT
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"   >> $GITHUB_OUTPUT
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}"  >> $GITHUB_OUTPUT
            echo "STORE_PASS=${{ secrets.ANDROID_STORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "Usando keystore do secret ANDROID_KEYSTORE_BASE64"
          else
            # Secret não configurado — gerar keystore temporária para CI
            echo "Secret ANDROID_KEYSTORE_BASE64 nao configurado. Gerando keystore temporaria para CI..."
            keytool -genkey -v \
              -keystore /tmp/licensemanager.keystore \
              -alias licensemanager \
              -keyalg RSA -keysize 2048 \
              -validity 1 \
              -storepass ci_temp_pass \
              -keypass ci_temp_pass \
              -dname "CN=CI Build, O=LicenciamentoSoftware, C=BR" \
              -noprompt
            echo "KEYSTORE_PATH=/tmp/licensemanager.keystore" >> $GITHUB_OUTPUT
            echo "KEY_ALIAS=licensemanager"                   >> $GITHUB_OUTPUT
            echo "KEY_PASS=ci_temp_pass"                      >> $GITHUB_OUTPUT
            echo "STORE_PASS=ci_temp_pass"                    >> $GITHUB_OUTPUT
            echo "TEMP_KEYSTORE=true"                         >> $GITHUB_OUTPUT
            echo "Keystore temporaria gerada para CI"
          fi

      - name: Publicar MAUI Android (APK assinado)
        run: |
          dotnet publish src/LicenciamentoSoftware.Maui/LicenciamentoSoftware.Maui.csproj \
            -f net10.0-android \
            -c Release \
            /p:AndroidPackageFormats=apk \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore="${{ steps.keystore.outputs.KEYSTORE_PATH }}" \
            /p:AndroidSigningKeyAlias="${{ steps.keystore.outputs.KEY_ALIAS }}" \
            /p:AndroidSigningKeyPass="${{ steps.keystore.outputs.KEY_PASS }}" \
            /p:AndroidSigningStorePass="${{ steps.keystore.outputs.STORE_PASS }}" \
            -o ./publish/android

      - name: Localizar APK gerado
        id: apk
        run: |
          APK=$(find ./publish/android -name "*-Signed.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find ./publish/android -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "APK nao encontrado. Conteudo de publish/android:"
            find ./publish/android -type f 2>/dev/null | head -20 || echo "Pasta nao existe"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          echo "APK encontrado: $APK"
          ls -lh "$APK"

      - name: Copiar APK para pasta de artefatos
        run: |
          mkdir -p ./artifacts
          SUFFIX=""
          if [ "${{ steps.keystore.outputs.TEMP_KEYSTORE }}" = "true" ]; then
            SUFFIX="-ci-unsigned"
          fi
          DEST="./artifacts/LicenseManager-${{ steps.version.outputs.DISPLAY_VERSION }}-android${SUFFIX}.apk"
          cp "${{ steps.apk.outputs.APK_PATH }}" "$DEST"
          echo "APK copiado: $DEST"
          ls -lh ./artifacts/

      - name: Publicar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: LicenseManager-Android-${{ steps.version.outputs.DISPLAY_VERSION }}
          path: ./artifacts/
          retention-days: 90
          if-no-files-found: error

      - name: Criar ou atualizar GitHub Release
        if: steps.keystore.outputs.TEMP_KEYSTORE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.DISPLAY_VERSION }}
          name: LicenseManager Android v${{ steps.version.outputs.DISPLAY_VERSION }}
          body: |
            ## LicenseManager Android v${{ steps.version.outputs.DISPLAY_VERSION }}

            ### Instalação

            Veja as instruções de sideload em [docs/instalacao-android.md](https://github.com/carloscampos2014/LicenciamentoSoftware/blob/master/docs/instalacao-android.md).
          draft: false
          prerelease: false
          make_latest: false
          files: ./artifacts/*
