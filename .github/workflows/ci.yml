name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licenciamento
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: licenciamento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # MAUI requer workloads de plataforma não disponíveis no ubuntu-latest.
      # Os projetos backend e Client são compilados aqui.
      # MAUI é compilado e testado localmente.
      - name: Restore
        run: |
          dotnet restore src/LicenciamentoSoftware.Domain/LicenciamentoSoftware.Domain.csproj
          dotnet restore src/LicenciamentoSoftware.Application/LicenciamentoSoftware.Application.csproj
          dotnet restore src/LicenciamentoSoftware.Infrastructure/LicenciamentoSoftware.Infrastructure.csproj
          dotnet restore src/LicenciamentoSoftware.Api/LicenciamentoSoftware.Api.csproj
          dotnet restore src/LicenciamentoSoftware.Client/LicenciamentoSoftware.Client.csproj
          dotnet restore src/LicenciamentoSoftware.Web/LicenciamentoSoftware.Web.csproj
          dotnet restore tests/LicenciamentoSoftware.Domain.Tests/LicenciamentoSoftware.Domain.Tests.csproj
          dotnet restore tests/LicenciamentoSoftware.Application.Tests/LicenciamentoSoftware.Application.Tests.csproj
          dotnet restore tests/LicenciamentoSoftware.IntegrationTests/LicenciamentoSoftware.IntegrationTests.csproj
          dotnet restore tests/LicenciamentoSoftware.Maui.Tests/LicenciamentoSoftware.Maui.Tests.csproj

      - name: Build
        run: |
          dotnet build src/LicenciamentoSoftware.Domain/LicenciamentoSoftware.Domain.csproj --no-restore -c Release
          dotnet build src/LicenciamentoSoftware.Application/LicenciamentoSoftware.Application.csproj --no-restore -c Release
          dotnet build src/LicenciamentoSoftware.Infrastructure/LicenciamentoSoftware.Infrastructure.csproj --no-restore -c Release
          dotnet build src/LicenciamentoSoftware.Api/LicenciamentoSoftware.Api.csproj --no-restore -c Release
          dotnet build src/LicenciamentoSoftware.Client/LicenciamentoSoftware.Client.csproj --no-restore -c Release
          dotnet build src/LicenciamentoSoftware.Web/LicenciamentoSoftware.Web.csproj --no-restore -c Release
          dotnet build tests/LicenciamentoSoftware.Domain.Tests/LicenciamentoSoftware.Domain.Tests.csproj --no-restore -c Release
          dotnet build tests/LicenciamentoSoftware.Application.Tests/LicenciamentoSoftware.Application.Tests.csproj --no-restore -c Release
          dotnet build tests/LicenciamentoSoftware.IntegrationTests/LicenciamentoSoftware.IntegrationTests.csproj --no-restore -c Release
          dotnet build tests/LicenciamentoSoftware.Maui.Tests/LicenciamentoSoftware.Maui.Tests.csproj --no-restore -c Release

      - name: Testes unitários — Domain
        run: |
          dotnet test tests/LicenciamentoSoftware.Domain.Tests \
            --no-build -c Release \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=domain-results.trx" \
            --results-directory ./test-results

      - name: Testes unitários — Application
        run: |
          dotnet test tests/LicenciamentoSoftware.Application.Tests \
            --no-build -c Release \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=application-results.trx" \
            --results-directory ./test-results

      - name: Testes unitários — MAUI (Converters e ViewModels)
        run: |
          dotnet test tests/LicenciamentoSoftware.Maui.Tests \
            --no-build -c Release \
            --logger "trx;LogFileName=maui-results.trx" \
            --results-directory ./test-results

      - name: Testes de integração
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=licenciamento_test;Username=licenciamento;Password=ci_password"
        run: |
          dotnet test tests/LicenciamentoSoftware.IntegrationTests \
            --no-build -c Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results

      - name: Publicar resultados dos testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx
