name: Deploy API

on:
  push:
    branches:
      - master
    paths:
      - "src/LicenciamentoSoftware.Api/**"
      - "src/LicenciamentoSoftware.Application/**"
      - "src/LicenciamentoSoftware.Infrastructure/**"
      - "src/LicenciamentoSoftware.Domain/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish e Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/LicenciamentoSoftware.Api/LicenciamentoSoftware.Api.csproj

      - name: Publish API
        run: |
          dotnet publish src/LicenciamentoSoftware.Api/LicenciamentoSoftware.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o ./publish/api

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Parar serviço na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo systemctl stop licenciamento-api || true"

      - name: Preparar diretório na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo mkdir -p /opt/licenciamento/api && sudo chown ubuntu:ubuntu /opt/licenciamento/api"

      - name: Enviar arquivos para VM
        run: |
          rsync -rlptz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./publish/api/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/licenciamento/api/

      - name: Atualizar variáveis de ambiente na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          sudo tee /etc/licenciamento/env > /dev/null << ENVEOF
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://localhost:5016
          ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}
          JwtSettings__Secret=${{ secrets.JWT_SECRET }}
          JwtSettings__Emissor=LicenciamentoSoftware
          JwtSettings__Audiencia=LicenciamentoSoftware
          JwtSettings__AccessTokenMinutos=60
          HmacSettings__Secret=${{ secrets.HMAC_SECRET }}
          ENVEOF
          sudo chmod 600 /etc/licenciamento/env
          sudo chown root:root /etc/licenciamento/env
          EOF

      - name: Ajustar permissões e iniciar serviço
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo chown -R www-data:www-data /opt/licenciamento/api && \
               sudo systemctl enable licenciamento-api && \
               sudo systemctl start licenciamento-api"

      - name: Aguardar serviço iniciar
        run: sleep 15

      - name: Verificar health check
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "curl -f -H 'Host: licensemanager-api.enzojb.com.br' http://localhost:80/health || (sudo systemctl status licenciamento-api && exit 1)"

      - name: Purgar cache do Cloudflare
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | grep -q '"success":true' && echo "Cache purgado com sucesso" || echo "Aviso: purge pode ter falhado"
