name: Deploy Web (Blazor WASM)

on:
  push:
    branches:
      - master
    paths:
      - "src/LicenciamentoSoftware.Web/**"
      - "src/LicenciamentoSoftware.Web.Server/**"
      - "src/LicenciamentoSoftware.Client/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish e Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/LicenciamentoSoftware.Web/LicenciamentoSoftware.Web.csproj

      - name: Publish Blazor WASM
        run: |
          dotnet publish src/LicenciamentoSoftware.Web/LicenciamentoSoftware.Web.csproj \
            -c Release \
            -o ./publish/web

      # Blazor WASM: todas as rotas devem servir index.html (SPA routing)
      - name: Configurar roteamento SPA
        run: |
          cp ./publish/web/wwwroot/index.html ./publish/web/wwwroot/404.html

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preparar diretório na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo mkdir -p /var/www/licensemanager && sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/licensemanager"

      - name: Enviar arquivos para VM
        run: |
          rsync -rlptz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./publish/web/wwwroot/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/licensemanager/

      - name: Ajustar permissões
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo chown -R www-data:www-data /var/www/licensemanager && \
               sudo nginx -t && sudo systemctl reload nginx"

      - name: Verificar deploy
        run: |
          sleep 5
          curl -f http://${{ secrets.SSH_HOST }} \
            -H "Host: licensemanager.enzojb.com.br" \
            --retry 3 --retry-delay 5 \
            || echo "Verificação falhou — cheque o Nginx na VM"
