name: Deploy Web (Blazor WASM + BFF)

on:
  push:
    branches:
      - master
    paths:
      - "src/LicenciamentoSoftware.Web/**"
      - "src/LicenciamentoSoftware.Web.Server/**"
      - "src/LicenciamentoSoftware.Client/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish e Deploy Web (BFF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore src/LicenciamentoSoftware.Web.Server/LicenciamentoSoftware.Web.Server.csproj

      - name: Publish Web.Server (BFF)
        run: |
          dotnet publish src/LicenciamentoSoftware.Web.Server/LicenciamentoSoftware.Web.Server.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o ./publish/web

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Parar serviço BFF na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo systemctl stop licenciamento-web || true"

      - name: Preparar diretório na VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo mkdir -p /opt/licenciamento/web && sudo chown ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /opt/licenciamento/web && sudo chmod 755 /opt/licenciamento/web"

      - name: Enviar arquivos para VM
        run: |
          rsync -rlptz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./publish/web/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/licenciamento/web/

      - name: Ajustar permissões e iniciar serviço BFF
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "find /opt/licenciamento/web -type f -exec chmod 644 {} \; && \
               find /opt/licenciamento/web -type d -exec chmod 755 {} \; && \
               sudo systemctl enable licenciamento-web && \
               sudo systemctl start licenciamento-web"

      - name: Aguardar serviço iniciar
        run: sleep 10

      - name: Verificar health check do BFF
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "curl -f -H 'Host: licensemanager.enzojb.com.br' http://localhost:5017/health || \
               (sudo systemctl status licenciamento-web && exit 1)"

      - name: Purgar cache do Cloudflare
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | grep -q '"success":true' && echo "Cache purgado com sucesso" || echo "Aviso: purge pode ter falhado"
