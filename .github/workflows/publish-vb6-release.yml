name: Publish VB6/COM Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da DLL (ex: 1.0.0)"
        required: false
        default: ""

jobs:
  publish:
    name: Build DLL COM e Publicar Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $xml = [xml](Get-Content "sdks/vb6/LicenseManagerSdk/LicenseManagerSdk.csproj")
            $v = $xml.Project.PropertyGroup.Version | Select-Object -First 1
            if (-not $v) { $v = "1.0.0" }
          }
          Write-Host "Versão: $v"
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore sdks/vb6/LicenseManagerSdk/LicenseManagerSdk.csproj

      - name: Testes
        run: dotnet test sdks/vb6/LicenseManagerSdk.Tests -c Release --logger "console;verbosity=minimal"

      - name: Build DLL (net48 — para COM Interop no Windows)
        shell: pwsh
        run: |
          dotnet build sdks/vb6/LicenseManagerSdk/LicenseManagerSdk.csproj `
            --no-restore -c Release `
            -f net48 `
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Gerar TLB via tlbexp
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "LicenseManagerSdk.dll" `
            sdks/vb6/LicenseManagerSdk/bin/Release/net48 | Select-Object -First 1

          if (-not $dll) {
            Write-Error "DLL nao encontrada"
            exit 1
          }
          Write-Host "DLL: $($dll.FullName)"

          # tlbexp gera o .tlb sem precisar de acesso ao registro
          $sdk = "C:\Program Files (x86)\Microsoft SDKs\Windows"
          $tlbexp = Get-ChildItem -Path $sdk -Recurse -Filter "tlbexp.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1

          if ($tlbexp) {
            Write-Host "Usando tlbexp: $($tlbexp.FullName)"
            & $tlbexp.FullName $dll.FullName /out:"$($dll.DirectoryName)\LicenseManagerSdk.tlb" /nologo
            Write-Host "TLB gerado via tlbexp"
          } else {
            Write-Host "tlbexp nao encontrado — DLL sera distribuida sem .tlb"
            Write-Host "O usuario pode gerar localmente com: regasm /codebase /tlb LicenseManagerSdk.dll"
          }

      - name: Copiar artefatos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts

          $dir = "sdks/vb6/LicenseManagerSdk/bin/Release/net48"

          Copy-Item "$dir/LicenseManagerSdk.dll" "./artifacts/LicenseManagerSdk.dll"
          if (Test-Path "$dir/LicenseManagerSdk.tlb") {
            Copy-Item "$dir/LicenseManagerSdk.tlb" "./artifacts/LicenseManagerSdk.tlb"
            Write-Host "TLB incluido"
          } else {
            Write-Host "TLB nao gerado — apenas DLL sera publicada"
          }
          ls ./artifacts/

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: sdk-vb6-v${{ steps.version.outputs.VERSION }}
          name: LicenseManager SDK VB6/COM v${{ steps.version.outputs.VERSION }}
          body: |
            ## LicenseManager SDK VB6/COM v${{ steps.version.outputs.VERSION }}

            DLL COM para integração com a API de validação a partir de **VB6, VBA, Delphi** e qualquer linguagem COM.

            ### Instalação

            1. Baixe `LicenseManagerSdk.dll` e `LicenseManagerSdk.tlb`
            2. Execute como Administrador:
               ```cmd
               regasm /codebase /tlb LicenseManagerSdk.dll
               ```

            ### Uso no VB6

            ```vb
            Set client = CreateObject("LicenseManagerSdk.LicenseManagerClient")
            Dim json As String
            json = client.Login("usuario@empresa.com")
            ```

            Veja o guia completo em [sdks/vb6/README.md](https://github.com/carloscampos2014/LicenciamentoSoftware/blob/master/sdks/vb6/README.md).
          draft: false
          prerelease: false
          make_latest: false
          files: ./artifacts/*
