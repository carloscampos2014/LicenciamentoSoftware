name: SDK Tests

on:
  push:
    branches:
      - master
      - "feature/fase-14*"
      - "feature/fase-15*"
    paths:
      - "sdks/**"
      - ".github/workflows/sdk-tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "sdks/**"
      - ".github/workflows/sdk-tests.yml"

jobs:
  # ---------------------------------------------------------------------------
  # C# / .NET
  # ---------------------------------------------------------------------------
  sdk-csharp:
    name: SDK C# (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore sdks/csharp/LicenseManagerSdk.sln
      - name: Build
        run: dotnet build sdks/csharp/LicenseManagerSdk.sln --no-restore -c Release
      - name: Testes
        run: |
          dotnet test sdks/csharp/LicenseManagerSdk.Tests \
            --no-build -c Release \
            --logger "console;verbosity=minimal"

  # ---------------------------------------------------------------------------
  # Java / Kotlin
  # ---------------------------------------------------------------------------
  sdk-java:
    name: SDK Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e Testes
        run: mvn -f sdks/java/pom.xml test --no-transfer-progress

  # ---------------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------------
  sdk-python:
    name: SDK Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: |
          pip install sdks/python
          pip install -r sdks/python/requirements-dev.txt
      - name: Testes
        run: pytest sdks/python/tests --tb=short

  # ---------------------------------------------------------------------------
  # JavaScript / TypeScript
  # ---------------------------------------------------------------------------
  sdk-javascript:
    name: SDK JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/javascript/package.json
      - name: Instalar dependências
        run: npm install
        working-directory: sdks/javascript
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: sdks/javascript
      - name: Testes
        run: npm test
        working-directory: sdks/javascript

  # ---------------------------------------------------------------------------
  # Rust
  # ---------------------------------------------------------------------------
  sdk-rust:
    name: SDK Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdks/rust/target
          key: cargo-${{ hashFiles('sdks/rust/Cargo.lock') }}
          restore-keys: cargo-
      - name: Build
        run: cargo build --manifest-path sdks/rust/Cargo.toml
      - name: Testes
        run: cargo test --manifest-path sdks/rust/Cargo.toml

  # ---------------------------------------------------------------------------
  # Ruby
  # ---------------------------------------------------------------------------
  sdk-ruby:
    name: SDK Ruby
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.1", "3.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Testes
        run: bundle exec rspec
        working-directory: sdks/ruby

  # ---------------------------------------------------------------------------
  # PHP
  # ---------------------------------------------------------------------------
  sdk-php:
    name: SDK PHP
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: none
      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist
        working-directory: sdks/php
      - name: Testes
        run: composer test
        working-directory: sdks/php

  # ---------------------------------------------------------------------------
  # VB6/COM (C#)
  # ---------------------------------------------------------------------------
  sdk-vb6:
    name: SDK VB6/COM (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: |
          dotnet restore sdks/vb6/LicenseManagerSdk/LicenseManagerSdk.csproj
          dotnet restore sdks/vb6/LicenseManagerSdk.Tests/LicenseManagerSdk.Tests.csproj
      - name: Build
        run: dotnet build sdks/vb6/LicenseManagerSdk/LicenseManagerSdk.csproj --no-restore -c Release
      - name: Testes
        run: |
          dotnet test sdks/vb6/LicenseManagerSdk.Tests \
            -c Release \
            --logger "console;verbosity=minimal"
