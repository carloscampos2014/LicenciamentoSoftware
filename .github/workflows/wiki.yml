name: Sincronizar Wiki

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sincronizar docs com Wiki GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v7

      - name: Clonar wiki
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/carloscampos2014/LicenciamentoSoftware.wiki.git wiki || {
            echo "Wiki ainda nao inicializada. Inicializando..."
            mkdir -p wiki
            cd wiki
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/carloscampos2014/LicenciamentoSoftware.wiki.git
          }
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copiar páginas para wiki
        run: |
          # Home da wiki = README do repositório
          cp README.md wiki/Home.md

          # Páginas principais
          cp docs/ARCHITECTURE.md         wiki/Arquitetura.md
          cp docs/development-plan.md     wiki/Plano-de-Desenvolvimento.md
          cp docs/quickstart.md           wiki/Guia-de-Inicio-Rapido.md
          cp docs/api-validacao.md        wiki/API-de-Validacao.md
          cp docs/contributing.md         wiki/Contribuindo.md

      - name: Commit e push na wiki
        run: |
          cd wiki
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca na wiki."
          else
            git commit -m "docs: sincronizar wiki com docs/ do repositorio"
            git push origin HEAD:master 2>/dev/null || git push origin HEAD:main 2>/dev/null || git push --set-upstream origin HEAD:master
          fi
