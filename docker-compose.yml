services:
  postgres:
    image: postgres:16-alpine
    container_name: licenciamento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: licenciamento_dev
      POSTGRES_USER: licenciamento
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definida — copie .env.example para .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licenciamento -d licenciamento_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
