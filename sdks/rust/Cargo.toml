[package]
name        = "licensemanager-sdk"
version     = "1.0.3"
edition     = "2021"
description = "SDK cliente para a API de validação do LicenseManager"
license     = "MIT"
repository  = "https://github.com/carloscampos2014/LicenciamentoSoftware"
readme      = "README.md"
keywords    = ["licensemanager", "sdk", "licensing", "hmac"]
categories  = ["api-bindings", "authentication", "network-programming"]
exclude     = ["target/*"]

[dependencies]
reqwest   = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio     = { version = "1",    features = ["full"] }
serde     = { version = "1",    features = ["derive"] }
serde_json = "1"
hmac      = "0.12"
sha2      = "0.10"
hex       = "0.4"
uuid      = { version = "1",    features = ["v4"] }
chrono    = { version = "0.4",  features = ["serde"] }
thiserror = "1"

[dev-dependencies]
tokio    = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
